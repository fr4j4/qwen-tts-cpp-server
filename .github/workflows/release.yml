# Release: portable packages for Linux and Windows.
#   - Vulkan package (CPU + Vulkan backends): the default download, runs on
#     NVIDIA, AMD and Intel GPUs with just the driver, CPU otherwise.
#   - CUDA package (CPU + CUDA backends, cudart + cuBLAS included).
# Runs on every push to main (publishes the GitHub Release v<VERSION>, with
# the packages and their .sha256, unless that release already exists: bump
# the VERSION file to cut a new one), on a v* tag, or by hand from the
# Actions tab (packages only, as workflow artifacts).
# Building CUDA needs no GPU: nvcc compiles on the hosted runner ; a GPU is
# only needed to run the result.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: "1.3.296.0"
  CUDA_VERSION: "12.4.1"

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "::warning::release v$version already exists: packages are built but not published (bump VERSION)"
            else
              publish=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  linux-vulkan:
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ xz-utils
          curl -fsSL -o vulkansdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          mkdir -p "$HOME/vulkansdk" && tar -xf vulkansdk.tar.xz -C "$HOME/vulkansdk"
          echo "VULKAN_SDK=$HOME/vulkansdk/${VULKAN_SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "$HOME/vulkansdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"
      - name: Build and package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: scripts/package.sh vulkan
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-vulkan
          path: dist/*.tar.gz*

  linux-cuda:
    needs: meta
    runs-on: ubuntu-22.04
    # CUDA 12.4 on Ubuntu 22.04 (glibc 2.35) ; architectures from
    # CMakeLists.txt (Turing to Ada).
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake make g++ git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/package.sh cuda
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-cuda
          path: dist/*.tar.gz*

  windows-vulkan:
    needs: meta
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          curl.exe -fsSL -o vulkan-sdk.exe $url
          Start-Process -FilePath .\vulkan-sdk.exe -Wait -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # ggml-vulkan wants SPIRV-Headers as a CMake package and the Windows
      # SDK installer does not ship its config files: build the matching tag.
      - name: SPIRV-Headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch "vulkan-sdk-$env:VULKAN_SDK_VERSION" https://github.com/KhronosGroup/SPIRV-Headers.git spirv-src
          cmake -S spirv-src -B spirv-build "-DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP\spirv"
          cmake --install spirv-build --config Release
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP\spirv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build and package
        shell: pwsh
        run: scripts/package.ps1 -Variant vulkan -Version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-vulkan
          path: dist/*.zip*

  windows-cuda:
    needs: meta
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - name: Build and package
        shell: pwsh
        run: scripts/package.ps1 -Variant cuda -Version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-cuda
          path: dist/*.zip*

  publish:
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, linux-vulkan, linux-cuda, windows-vulkan, windows-cuda]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
